<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Segoe UI,Roboto,Arial;
    background:#f4f7f9;
    padding:20px;
}

#homeBtn {
    text-decoration: none;
    color: white;
    font-weight: 600;
    background-color: #698f80;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
}

#homeBtn:hover {
    background-color: #8392af;
}

.top-bar{
    display:grid;
    row-gap: 8px;
    margin-bottom:20px;
}

.top-bar span{
    font-size: 24px;
    font-weight:bold;
}

@media (min-width:520px){
    .top-bar{
        display:flex;
        justify-content:space-between;
        align-items:start;
    }
}

#downloadBtn{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    background:#1e293b;
    color:white;
    cursor:pointer;
    font-weight:600;
}

h2{margin-bottom:20px}

.filters{
    display:grid;
    gap:12px;
    margin-bottom:20px;
    grid-template-columns:1fr;
}

@media (min-width:480px){
    .filters{grid-template-columns:repeat(2,1fr)}
}

@media (min-width:768px){
    .filters{grid-template-columns:repeat(3,1fr)}
}

@media (min-width:1024px){
    .filters{grid-template-columns:repeat(5,1fr)}
}

.filters input,.filters select{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ddd;
    border-radius:6px;
}

.table-wrapper{
    overflow-x:auto;
    background:#fff;
    border-radius:8px;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

th{
    background:#2f3542;
    color:#fff;
    position:sticky;
    top:0;
}

th:first-child, td:first-child {
    width: 50px;
    min-width: 50px;
    max-width: 50px;
    text-align: center;
}

</style>
</head>

<body>

<div style="display:flex;justify-content:start;align-items:center;">
    <a id="homeBtn" href="./index.html"><span style="font-size:smaller">&#9664;</span> Back</a>
</div>

<div class="top-bar">
    <span>Diary</span>
    <span id="totalReceivedSpan"></span>
    <button id="downloadBtn">Download Diary</button>
</div>

<div class="filters">
<select id="classFilter">
<option value="">All Classes</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>

<select id="mediumFilter">
<option value="">All Medium</option>
<option>EM</option>
<option>MM</option>
</select>

<input id="nameFilter" placeholder="Student Name">
<input id="admFilter" placeholder="Admission No">
<input type="date" id="dateFilter">
</div>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th><input type="checkbox" id="selectAll"></th>
<th>Admission Date</th>
<th>Admission No</th>
<th>Name</th>
<th>Class</th>
<th>Medium</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>
const tableBody = document.getElementById("tableBody");

const classFilter = document.getElementById("classFilter");
const mediumFilter = document.getElementById("mediumFilter");
const nameFilter = document.getElementById("nameFilter");
const admFilter = document.getElementById("admFilter");
const dateFilter = document.getElementById("dateFilter");
const selectAll = document.getElementById("selectAll");

let data = [];
let totalReceived = 0;
let filteredData = [];

selectAll.addEventListener("change",()=>{
    const checks = document.querySelectorAll(".rowCheck");
    checks.forEach(c=> c.checked = selectAll.checked);
});

/* 🔥 LOAD FROM BACKEND */
async function load(){
    try{
        // const res = await fetch("http://localhost:8000/students");   // 🔥 change if endpoint name different
        const res = await fetch("https://testbackend-99um.onrender.com/students");
        data = await res.json();

        render(data);
    }catch(e){
        alert("Failed to load diary students");
        console.error(e);
    }
}
load();

/* render */
function render(students){
    tableBody.innerHTML="";
    selectAll.checked = false;   // reset
    filteredData = students;
    students.forEach(r=>{
        tableBody.innerHTML+=`
        <tr style="text-align:center;">
            <td>
                <input type="checkbox" class="rowCheck" data-adm="${r.adm_no}">
            </td>
            <td>${r.adm_date}</td>
            <td>${r.adm_no}</td>
            <td>${r.std_name}</td>
            <td>${r.std_class}</td>
            <td>${r.medium}</td>
        </tr>`;
    });
}

function formatDateToISO(dateStr){
    // "25 Feb 2026" → Date object
    const parts = dateStr.split(" ");

    const day = parseInt(parts[0]);

    const monthMap = {
        Jan:0, Feb:1, Mar:2, Apr:3,
        May:4, Jun:5, Jul:6, Aug:7,
        Sep:8, Oct:9, Nov:10, Dec:11
    };

    const month = monthMap[parts[1]];
    const year = parseInt(parts[2]);

    return new Date(year, month, day);
}

function normalizeDate(d){
    const nd = new Date(d);
    nd.setHours(0,0,0,0);
    return nd;
}

/* filter */
function filterData(){
    const c = classFilter.value.toLowerCase();
    const m = mediumFilter.value.toLowerCase();
    const n = nameFilter.value.toLowerCase();
    const a = admFilter.value.toLowerCase();
    const d = dateFilter.value;

    const selectedDate = d ? normalizeDate(new Date(d)) : null;

    const filtered = data.filter(r=>{
        const recordDate = formatDateToISO(r.adm_date);

        return (
            (!c || String(r.std_class).toLowerCase()==c) &&
            (!m || String(r.medium).toLowerCase()==m) &&
            (!n || String(r.std_name).toLowerCase().includes(n)) &&
            (!a || String(r.adm_no).toLowerCase().includes(a)) &&
            (!selectedDate || recordDate >= selectedDate)
        );
    });

    render(filtered);
}

[classFilter,mediumFilter,nameFilter,admFilter,dateFilter]
.forEach(el=>el.addEventListener("input",filterData));

document.getElementById("downloadBtn").addEventListener("click",()=>{

    const selected = [];

    document.querySelectorAll(".rowCheck:checked").forEach(cb=>{
        const adm = cb.dataset.adm;
        const diaryData = data.find(d=> String(d.adm_no) === String(adm));
        if(diaryData) selected.push(diaryData);
    });

    if(!selected.length){
        alert("Select at least one student");
        return;
    }

    sessionStorage.setItem("multi_diaries", JSON.stringify(selected));

    console.log(selected);

    window.open("diary.html","_blank");
});

</script>

</body>
</html>
