<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Dues</title>

<!-- pdf generator -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Segoe UI,Roboto,Arial;
    background:#f4f7f9;
    padding:20px;
}

#homeBtn{
    text-decoration:none;
    color:white;
    font-weight:600;
    background:#698f80;
    padding:6px 12px;
    border-radius:8px;
}
#homeBtn:hover{background:#8392af}

.top-bar{
    display:grid;
    row-gap: 8px;
    margin-bottom:20px;
}

.top-bar span{
    font-size: 24px;
    font-weight:bold;
}

#downloadBtn{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    background:#1e293b;
    color:white;
    cursor:pointer;
    font-weight:600;
}

@media (min-width:520px){
    .top-bar{
        display:flex;
        justify-content:space-between;
        align-items:start;
    }
}

.std-count-div{
    display:grid;
    justify-content: center;
    row-gap:4px;
    margin-bottom:20px;
    text-align: center;
}

.std-count-div span{
    font-size:18px;
    font-weight:bold;
}

.std-count-div #totalstdcount{
    color:green;
    font-size:22px;
}

.std-count-div #filterstdcount{
    color:blue;
    font-size:22px;
}

@media (min-width:480px){
    .std-count-div{display:flex;column-gap: 20px;}
}

/* 🔥 Responsive Filters */
.filters{
    display:grid;
    gap:10px;
    margin-bottom:20px;
    grid-template-columns:1fr;
}

@media (min-width:480px){
    .filters{grid-template-columns:repeat(2,1fr)}
}

@media (min-width:768px){
    .filters{grid-template-columns:repeat(3,1fr)}
}

@media (min-width:1024px){
    .filters{grid-template-columns:repeat(4,1fr)}
}

.filters input, .filters select{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #ddd;
    border-radius:6px;
}

.feeFilterDiv{
    display:flex;
    align-items:center;
    gap:3px;
}

.filters .feeFilterDiv span{
    font-size:16px;
    font-weight:600;
    white-space: nowrap;
}

/* 🔥 Table */
.table-wrapper{
    overflow-x:auto;
    background:#fff;
    border-radius:8px;
}

table{
    width:100%;
    min-width:1000px;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

th{
    background:#2f3542;
    color:#fff;
    position:sticky;
    top:0;
}
</style>
</head>

<body>

<div style="margin-bottom:10px">
    <a id="homeBtn" href="./index.html">&#9664; Back</a>
</div>

<div class="top-bar">
    <span>Fee Dues</span>
    <button id="downloadBtn">Download List</button>
</div>

<div class="std-count-div">
    <span id="totalstdlabel">Total Students: <span id="totalstdcount"></span></span>
    <span id="filterstdlabel">Filtered Students: <span id="filterstdcount"></span></span>
</div>

<!-- 🔥 Filters -->
<div class="filters">

    <select id="classFilter">
        <option value="">All Classes</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
    </select>
    
    <select id="mediumFilter">
        <option value="">All Medium</option>
        <option>EM</option>
        <option>MM</option>
    </select>

    <select id="schoolFilter">
        <option value="">All Schools</option>
    </select>

    <div class="feeFilterDiv">
        <span>Fee less than :</span><input id="feeAmt" placeholder="Amount">
    </div>

</div>

<!-- 🔥 Table -->
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Adm No</th>
<th>Name</th>
<th>Adm Date</th>
<th>School</th>
<th>Address</th>
<th>Mobile</th>
<th>Class</th>
<th>Medium</th>
<th>NMMS</th>
<th>Total Fee</th>
<th>Fee Reduction</th>
<th>Total Paid</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>
const tableBody = document.getElementById("tableBody");
const totalStdCount = document.getElementById("totalstdcount");
const filteredStdCount = document.getElementById("filterstdcount");

const classFilter = document.getElementById("classFilter");
const mediumFilter = document.getElementById("mediumFilter");
const schoolFilter = document.getElementById("schoolFilter");
const feeFilter = document.getElementById("feeAmt");

let data = [];
let currentFilteredData = [];
let totalStudentsCount = 0;
let filteredDataCount = 0;

document.getElementById("downloadBtn").addEventListener("click", generatePDF);

/* 🔥 Load students */
async function load(){
    try{
        const res = await fetch("http://localhost:8000/students");
        // const res = await fetch("https://testbackend-99um.onrender.com/students");
        data = await res.json();

        totalStudentsCount = data.length;
        totalStdCount.textContent = totalStudentsCount;
        render(data);
        currentFilteredData = data;
        loadSchoolDropdown(data);
    }catch(e){
        alert("Failed to load students");
    }
}
load();

/* 🔥 Render */
function render(list){
    tableBody.innerHTML="";
    filteredDataCount = list.length;
    filteredStdCount.textContent = filteredDataCount;
    list.forEach(r=>{
        tableBody.innerHTML += `
        <tr style="text-align:center;">
            <td><b>${r.adm_no}</b></td>
            <td>${r.std_name}</td>
            <td>${r.adm_date}</td>
            <td>${r.school}</td>
            <td>${r.address}</td>
            <td>${r.mobile}</td>
            <td>${r.std_class}</td>
            <td>${r.medium}</td>
            <td>${r.nmms}</td>
            <td>${r.total_fee}</td>
            <td>${r.fee_reduction}</td>
            <td>${r.prev_paid}</td>
            <td>${r.balance}</td>
        </tr>`;
    });
}

function loadSchoolDropdown(data){

    const schoolSet = new Set();

    // collect unique schools
    for(const item of data){

        if(item.school && item.school.trim() !== ""){
            schoolSet.add(item.school);
        }
    }

    // convert to array and sort
    const schools = Array.from(schoolSet).sort();

    // clear old options
    schoolFilter.innerHTML = `
        <option value="">All Schools</option>
    `;

    // add schools to dropdown
    for(const school of schools){

        schoolFilter.innerHTML += `
            <option value="${school}">
                ${school}
            </option>
        `;
    }
}

/* 🔥 Filter */
function filterData(){
    const feeAmt = feeFilter.value;
    const c = classFilter.value.toLowerCase();
    const m = mediumFilter.value.toLowerCase();
    const s = schoolFilter.value.toLowerCase();

    const filtered = data.filter(r =>
        (!feeAmt || parseFloat(r.prev_paid) < parseFloat(feeAmt)) &&
        (!c || r.std_class.toLowerCase() === c) &&
        (!m || r.medium.toLowerCase() === m) &&
        (!s || r.school.toLowerCase() === s)
    );

    currentFilteredData = filtered;
    render(filtered);
}

[feeFilter, classFilter, mediumFilter, schoolFilter].forEach(el=>{
    el.addEventListener("input",filterData);
});

async function generatePDF(){

    const feeLessThan = feeFilter.value || "None";
    const schoolName = schoolFilter.value || "All Schools";
    const schoolClass = classFilter.value || "All";
    const schoolMedium = mediumFilter.value || "All";

    const subHeading = `Students List of ${schoolName} (Fee paid <${feeLessThan}) (Class: ${schoolClass}) (Medium: ${schoolMedium})`;

    const saveFileName = `Fee_Due_List_${schoolName}_FeeLessThan_${feeLessThan}_Class_${schoolClass}_Medium_${schoolMedium}.pdf`;

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4"
    });

    // 🔥 Table data
    const body = [];

    currentFilteredData.forEach((r,index)=>{

        body.push([
            index + 1,
            r.adm_no,
            r.std_name,
            r.total_fee,
            r.prev_paid,
            r.balance
        ]);

    });

    // 🔥 Table
    pdf.autoTable({
        startY: 28,

        head:[[
            "Sl No",
            "Adm No",
            "Name",
            "Total Fee",
            "Total Paid",
            "Balance"
        ]],

        body: body,

        theme:"grid",

        styles:{
            fontSize:10,
            cellPadding:3,
            halign:"center"
        },

        headStyles:{
            fillColor:[47,53,66]
        },

        columnStyles:{
            2:{ halign:"left" }
        },

        margin:{
            top:28
        },

        didDrawPage:function(){

            // 🔥 Repeat heading on every page
            pdf.setFontSize(16);
            pdf.text("PHOENIX EDU CAMPUS OTHUKKUNGAL 2026-27", 105, 15, { align:"center" });

            pdf.setFontSize(12);
            pdf.text(subHeading, 105, 22, { align:"center" });
        }
    });

    pdf.save(saveFileName);
}

</script>

</body>
</html>
